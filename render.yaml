# Render Blueprint: New → Blueprint → pick this repo.
services:
  - type: web
    name: rekindle
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Writing to Campfire (stamping, invoices) is off unless this is "true".
      # Set by hand in Render so a deploy never switches it.
      - key: REKINDLE_WRITE
        sync: false
      # The Campfire product used on invoice lines; its income account should
      # be 13190 Unbilled Receivable so invoicing clears the unbilled balance.
      - key: REKINDLE_INVOICE_PRODUCT_ID
        sync: false
      # Secrets: Render asks for these; add any left blank later under Environment.
      - key: CAMPFIRE_API_KEY
        sync: false
      - key: CAMPFIRE_WEBHOOK_SECRET
        sync: false
      # Admin access token (machine endpoints and token sign-in); Render generates it.
      - key: REKINDLE_ADMIN_TOKEN
        generateValue: true
      # Signs sign-in cookies; Render generates it.
      - key: SESSION_SECRET
        generateValue: true
      # Postgres: the Internal Database URL of a Render Postgres instance.
      - key: DATABASE_URL
        sync: false
      # Google sign-in (OAuth client from Google Cloud Console).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Who can sign in, and who is an admin (comma-separated emails).
      - key: REKINDLE_ALLOWED_DOMAIN
        value: campfire.ai
      - key: REKINDLE_ADMINS
        sync: false
